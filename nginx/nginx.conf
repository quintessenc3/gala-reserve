
user nginx;

events {
    worker_connections 2048;
}
worker_processes auto;

http {
    include mime.types;

    server {
        listen 80;
        server_name gala-reserve.ru www.gala-reserve.ru;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name gala-reserve.ru www.gala-reserve.ru;
        http2 on;

        location / {
            add_header Strict-Transport-Security max-age=20;

            proxy_pass http://api:8000;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static {
            alias /usr/share/nginx;
        }

        location /media {
            alias /usr/share/media;
        }

        ssl_certificate /etc/letsencrypt/live/gala-reserve.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gala-reserve.ru/privkey.pem;
        ssl_prefer_server_ciphers on;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets on;
    }
}