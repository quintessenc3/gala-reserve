[project]
name = "gala-reserve"
version = "0.1.0"
description = "Backend сервиса мероприятий с ограниченным количеством мест, поддерживающий создание событий, регистрацию участников, мгновенную выдачу билетов на бесплатные мероприятия и временное резервирование мест на платных с последующей имитацией оплаты."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django==5.2",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest]
DJANGO_SETTINGS_MODULE = "eventhub.config.settings.test"