x-app: &app
  build: .
  environment:
    SECRET_KEY: ${SECRET_KEY}
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: psql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}
    REDIS_URL: redis://redis:6379/1
    EMAIL_HOST: ${EMAIL_HOST}
    EMAIL_PORT: ${EMAIL_PORT}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS}
    EMAIL_USE_SSL: ${EMAIL_USE_SSL}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gala-reserve-db:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$POSTGRES_USER", "-d", "$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    <<: *app
    depends_on:
      redis:    {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  worker:
    <<: *app
    command: celery -A config worker -l info -Q default,emails
    depends_on:
      redis:    {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  beat:
    <<: *app
    command: celery -A config beat -l INFO
    depends_on:
      redis:    {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

volumes:
  gala-reserve-db: