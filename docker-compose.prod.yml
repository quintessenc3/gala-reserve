x-prod: &prod
  build:
    target: prod
  image: galareserve:${APP_TAG:-prod}
  restart: unless-stopped
  init: true
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - media:/app/gala_reserve/media

services:
  api:
    <<: *prod
    expose: ["8000"]
    stop_grace_period: 35s
    restart: unless-stopped

  worker:
    <<: *prod
  beat:
    <<: *prod
    command: celery -A config beat --loglevel=INFO --schedule=/var/lib/celery/celerybeat-schedule

  nginx:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gala_reserve/staticfiles:/usr/share/staticfiles:ro
      - media:/usr/share/media:ro

  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  rabbitmq:
    restart: unless-stopped

volumes:
  media: