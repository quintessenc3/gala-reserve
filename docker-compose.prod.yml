x-prod: &prod
  build:
    target: prod
  image: galareserve:${APP_TAG:-prod}
  restart: unless-stopped
  init: true
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *prod
    expose: ["8000"]
    stop_grace_period: 35s
    #healthcheck:
    #  test: ["CMD", "python", "healthcheck.py"]
    #  interval: 15s
    #  timeout: 5s
    #  retries: 3
    #  start_period: 20s

  worker:
    <<: *prod

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gala_reserve/staticfiles:/usr/share/staticfiles:ro

  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  rabbitmq:
    restart: unless-stopped